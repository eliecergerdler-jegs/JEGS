<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#B8F12B" />
    <title>JEGS Digital | Offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #050816;
        color: #f4f8ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background:
          radial-gradient(circle at 50% 20%, rgba(184, 241, 43, 0.12), transparent 34%),
          radial-gradient(circle at 80% 80%, rgba(30, 123, 255, 0.14), transparent 32%),
          #050816;
      }

      main {
        width: min(100%, 520px);
        text-align: center;
      }

      img {
        width: 96px;
        height: 96px;
        object-fit: contain;
        filter: drop-shadow(0 0 22px rgba(184, 241, 43, 0.28));
      }

      h1 {
        margin: 24px 0 12px;
        font-size: clamp(2rem, 9vw, 4rem);
        line-height: 0.95;
        letter-spacing: 0;
      }

      p {
        margin: 0 auto;
        max-width: 34rem;
        color: #b8c4d9;
        font-size: 1rem;
        line-height: 1.65;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        margin-top: 28px;
        border-radius: 12px;
        border: 1px solid rgba(184, 241, 43, 0.45);
        padding: 0 18px;
        background: rgba(184, 241, 43, 0.12);
        color: #f4f8ff;
        font-weight: 800;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid #b8f12b;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon-jegs-v2-192.png" alt="JEGS Digital" width="96" height="96" />
      <h1>JEGS Digital</h1>
      <p>
        You are offline. Previously visited pages may still be available, and fresh project content will load when your connection returns.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
